name: Derle ve Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: derle
  cancel-in-progress: true

jobs:
  web:
    name: Web önizleme (GitHub Pages)
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - uses: actions/deploy-pages@v4

  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri kur
        run: npm ci

      - name: Android projesini oluştur
        run: |
          node scripts/hazirla.js config
          npx cap add android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/upload.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
            export KEYSTORE_PATH=$RUNNER_TEMP/upload.jks
          fi
          node scripts/hazirla.js android
          npx cap sync android

      - name: Test APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Yayın AAB derle (imzalı)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Dosyaları hazırla
        run: |
          mkdir -p cikti
          cp android/app/build/outputs/apk/debug/app-debug.apk cikti/oyun-test.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab cikti/oyun-yayin.aab
          fi

      - name: Son sürüm sayfasına yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son --yes --cleanup-tag || true
          gh release create son cikti/* --title "Son sürüm (#${{ github.run_number }})" --notes "Otomatik derleme #${{ github.run_number }}" --latest
